name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build web client
        run: npm --prefix web run build

      - name: Lint server syntax
        run: for f in server/src/*.js server/test/*.js; do node --check "$f"; done

      - name: Smoke test
        run: npm --prefix server test

  # Builds the production image and starts it, so a broken Docker layout or a
  # missing web build fails CI instead of reaching users.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: coupleroom:ci

      - name: Run image and check it serves the app
        run: |
          docker run -d --name coupleroom-ci -p 5088:5000 \
            -e ROOM_NAME=ci-room \
            coupleroom:ci

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5088/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:5088/api/health
          curl -sf http://127.0.0.1:5088/api/config | grep -q ci-room
          curl -sf http://127.0.0.1:5088/ | grep -q CoupleRoom

          docker logs coupleroom-ci
          docker rm -f coupleroom-ci
